services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MOCK_PORTAL_URL: http://mock-discom:${PORTAL_CONTAINER_PORT:-10000}
      PORT: ${BACKEND_CONTAINER_PORT:-8000}
    ports:
      - "${BACKEND_HOST_PORT:-8000}:${BACKEND_CONTAINER_PORT:-8000}"
    expose:
      - "${BACKEND_CONTAINER_PORT:-8000}"
    depends_on:
      - mock-discom

  mock-discom:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["sh", "-c", "uvicorn app.portal.mock_portal:app --host 0.0.0.0 --port $$PORT"]
    environment:
      PORT: ${PORTAL_CONTAINER_PORT:-10000}
    expose:
      - "${PORTAL_CONTAINER_PORT:-10000}"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_PORTAL_URL: ${VITE_PORTAL_URL:-/api/mock-discom/portal}
    environment:
      BACKEND_CONTAINER_PORT: ${BACKEND_CONTAINER_PORT:-8000}
      FRONTEND_CONTAINER_PORT: ${FRONTEND_CONTAINER_PORT:-80}
      NGINX_ENVSUBST_FILTER: ^(BACKEND_CONTAINER_PORT|FRONTEND_CONTAINER_PORT)$
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:${FRONTEND_CONTAINER_PORT:-80}"
    depends_on:
      - backend

