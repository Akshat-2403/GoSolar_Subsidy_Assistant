services:
  agent-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      MOCK_PORTAL_URL: http://mock-portal:10000
      PORT: "10000"
    ports:
      - "8000:10000"
    depends_on:
      - mock-portal

  mock-portal:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "app.portal.mock_portal:app", "--host", "0.0.0.0", "--port", "10000"]
    environment:
      PORT: "10000"
    ports:
      - "8001:10000"

