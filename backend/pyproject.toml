[project]
name = "rooftop-solar-subsidy-agent"
version = "0.1.0"
description = "Backend for the Rooftop Solar Subsidy Agent"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
    "langgraph>=1.0,<1.1",
    "langchain-openai>=0.3.30,<0.4",
    "pypdf>=5.0,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
